<dialog id="permission_denied_modal" class="modal modal-open">
    <div class="modal-box border-l-4 border-error shadow-xl max-w-md">
        <h3 class="font-bold text-lg text-error flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 stroke-current shrink-0" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            {{ modal_title|default:"Access Restricted" }}
        </h3>
        <p class="py-4 text-sm text-base-content/80">
            {{ message|default:"You do not have permission to perform this action." }}
        </p>
        <div class="modal-action">
            <button type="button" 
                    onclick="document.getElementById('permission_denied_modal').remove()" 
                    class="btn btn-sm btn-ghost">
                Close
            </button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button type="button" onclick="document.getElementById('permission_denied_modal').remove()">close</button>
    </form>
</dialog>
